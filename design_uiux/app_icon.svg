<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0f0721"/>
      <stop offset="100%" stop-color="#07030f"/>
    </linearGradient>

    <!-- Vibrant Core Gradients -->
    <linearGradient id="primaryVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="sunsetAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGlow)" stroke-width="3"/>

  <!-- Ambient Backdrop Glow Spots -->
  <circle cx="280" cy="220" r="130" fill="#7c3aed" opacity="0.38" filter="url(#ambientLight)"/>
  <circle cx="200" cy="320" r="110" fill="#ec4899" opacity="0.28" filter="url(#ambientLight)"/>
  <circle cx="340" cy="180" r="80" fill="#38bdf8" opacity="0.22" filter="url(#ambientLight)"/>

  <!-- Dynamic Curved Wallpaper / Horizon Aura Lines -->
  <g opacity="0.25">
    <path d="M40 380 Q 180 290, 320 370 T 472 320" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M40 410 Q 200 340, 360 410 T 472 370" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Central Emblem: Stylized Dynamic 'H' & Bird in Flight (Hon Chay E) -->
  <!-- Left wing / Dynamic Wing Arch -->
  <path d="M140 340 C 130 250, 180 160, 260 110 C 235 155, 230 210, 245 270 C 220 285, 180 320, 140 340 Z" 
        fill="url(#primaryVibrant)" 
        filter="url(#softGlow)"/>

  <!-- Top Soaring Crest / Swift Feather Flight Element -->
  <path d="M260 110 C 310 130, 370 170, 400 230 C 355 220, 305 225, 265 255 C 275 195, 275 145, 260 110 Z" 
        fill="url(#sunsetAccent)"/>

  <!-- Forward Motion Swoop / Energy Core (Forming 'H' and 'C' harmonious flow) -->
  <path d="M175 260 C 220 235, 280 235, 345 285 C 375 310, 395 345, 410 390 C 365 375, 310 355, 265 320 C 220 285, 195 275, 175 260 Z" 
        fill="url(#glowCyan)" 
        opacity="0.95"/>

  <!-- Core Prism Light Particle & Stars -->
  <circle cx="268" cy="216" r="10" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="268" cy="216" r="4" fill="#ffffff"/>

  <!-- Sparkle stars (Wallpaper brilliance) -->
  <path d="M380 130 Q 380 145, 395 145 Q 380 145, 380 160 Q 380 145, 365 145 Q 380 145, 380 130 Z" fill="#fbcfe8" opacity="0.85"/>
  <path d="M125 190 Q 125 200, 135 200 Q 125 200, 125 210 Q 125 200, 115 200 Q 125 200, 125 190 Z" fill="#bae6fd" opacity="0.8"/>
  <circle cx="395" cy="275" r="3.5" fill="#f472b6" opacity="0.9"/>
  <circle cx="150" cy="370" r="3" fill="#c084fc" opacity="0.75"/>

  <!-- Modern App Monogram Badge at Bottom -->
  <g transform="translate(196, 410)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="60" y="18" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f3e8ff" letter-spacing="2" text-anchor="middle">HON CHAY E</text>
  </g>
</svg>